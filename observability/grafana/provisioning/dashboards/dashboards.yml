apiVersion: 1

providers:
  - name: "GPU Fleet Autopilot Dashboards"
    orgId: 1
    folder: "GPU Fleet"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false

