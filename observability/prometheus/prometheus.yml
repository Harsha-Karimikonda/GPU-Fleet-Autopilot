global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: "us-east-cluster-1"
    environment: "simulation"

scrape_configs:
  - job_name: "gpu-autopilot"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080", "127.0.0.1:8080"]
        labels:
          service: "gpu-fleet-autopilot"
          engine: "rust"
