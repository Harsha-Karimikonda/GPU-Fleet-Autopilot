[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/server",
    "crates/cli",
    "crates/telemetry-gen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Harsha Karimikonda <harshakarimikonda22@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/Harsha-Karimikonda/GPU-Fleet-Autopilot"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rand = "0.8"
rand_distr = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
parking_lot = { version = "0.12", features = ["serde"] }
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
comfy-table = "7.1"
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

